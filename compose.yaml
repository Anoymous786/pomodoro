services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pomodoro-dashboard-app:latest
    container_name: pomodoro-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    # Runtime-only secrets (LLM keys etc.). Kept OUT of the image by
    # .dockerignore; loaded from the host at run time when present.
    env_file:
      - path: .env.local
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s